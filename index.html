<!doctype html>
<!-- HUMAN VETTED -->
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="description" content="A drag-to-transform algebra game.">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/app.css">
    <link rel="stylesheet" href="./styles/toolbars.css">

    <script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"></script>
    <script src="./scripts/typecheck.js"></script>
    <script src="./scripts/dom/Html.js"></script>

    <script src="./scripts/models/expression/ExpressionShape.js"></script>
    <script src="./scripts/models/expression/ExpressionCaveats.js"></script>
    <script src="./scripts/models/expression/ExpressionPaths.js"></script>
    <script src="./scripts/models/relation/Relation.js"></script>
    <script src="./scripts/models/orderlike/Orderlike.js"></script>
    <script src="./scripts/models/orderlike/Orderlikes.js"></script>
    <script src="./scripts/models/grouplike/Grouplike.js"></script>
    <script src="./scripts/models/grouplike/Grouplikes.js"></script>
    <script src="./scripts/models/ringlike/Scale.js"></script>
    <script src="./scripts/models/ringlike/Scales.js"></script>
    <script src="./scripts/models/ringlike/ScaleExpressions.js"></script>
    <script src="./scripts/models/ringlike/Power.js"></script>
    <script src="./scripts/models/ringlike/Powers.js"></script>
    <script src="./scripts/models/ringlike/PowerExpressions.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangle.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangles.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangleSameness.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangleComposition.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangleInverse.js"></script>
    <script src="./scripts/models/ringlike/Ringlikes.js"></script>
    <script src="./scripts/models/relation/RelationDragChoice.js"></script>
    <script src="./scripts/models/relation/Relations.js"></script>
    <script src="./scripts/models/relation/RelationPathOperations.js"></script>
    <script src="./scripts/models/relation/RelationDragOperations.js"></script>
    <script src="./scripts/models/app/AppState.js"></script>
    <script src="./scripts/models/app/AppHistoryTraversal.js"></script>
    <script src="./scripts/models/app/AppDragOperations.js"></script>
    <script src="./scripts/updaters/drags/DragState.js"></script>
    <script src="./scripts/updaters/drags/RelationDrags.js"></script>
    <script src="./scripts/updaters/AppUpdater.js"></script>
    <script src="./scripts/views/ExpressionView.js"></script>
    <script src="./scripts/views/RelationView.js"></script>
    <script src="./scripts/views/AppView.js"></script>

</head>

<body>

<div id="app">

    <div class="top left long-axis-group control">

        <div class="short-axis-group">

            <div class="banner"> 
                <div class="title"><div id="logo"></div>craft</div>
            </div>

            <div class="short-axis-group group-joined">

                <button id="undo" type="button" class="btn">
                    <div>Undo</div>
                    <img src="icons/undo.svg"/>
                    <div class="instructions">ctrl+Z</div>
                </button>

                <button id="redo" type="button" class="btn">
                    <div>Redo</div>
                    <img src="icons/redo.svg"/>
                    <div class="instructions">ctrl+Y</div>
                </button>

                <button id="restart" type="button" class="btn">
                    <div>Restart</div>
                    <img src="icons/rotate-ccw.svg"/>
                </button>

                <button id="history-toggle" type="button" class="btn operation-toggle" aria-pressed="true">
                    <div>History</div>
                    <img src="icons/history.svg"/>
                    <div id="history-indicator">Off</div>
                </button>

                <button id="auto-simplify" type="button" class="btn operation-toggle" aria-pressed="true">
                    <div>Simplify</div>
                    <img src="icons/equal.svg"/>
                    <div id="auto-simplify-indicator">On</div>
                </button>

                <button id="theme" type="button" class="btn">
                    <div>Theme</div>
                    <div id='light'><img src="icons/light.svg"/><div>Light</div></div>
                    <div id='dark'><img src="icons/dark.svg"/><div>Dark</div></div>
                </button>

            </div>

        </div>

        <div id="tagline" class="tagline">An introduction to algebra</div>

    </div>


    <nav class="top right control level-navigation" aria-label="Level navigation">

        <div class="level-navigation-header">

            <div class="short-axis-group group-joined">

                <button id="previous-level" type="button" class="btn">
                    <div>Previous</div>
                    <img src="icons/menu-left.svg"/>
                </button>

                <button id="next-level" type="button" class="btn">
                    <div>Next</div>
                    <img src="icons/menu-right.svg"/>
                </button>

            </div>

            <div id="level-counter" class="level-counter">1 / 40</div>

        </div>

        <div id="level-menu" class="level-menu" aria-label="Levels"></div>

    </nav>


    <main>

        <section id="history" class="history-stage" aria-label="Equation history" hidden></section>

        <section id="equation" class="equation-stage" aria-label="Interactive equation"></section>

        <section class="lesson-header">
            <div class="lesson-title-row">
                <h1 id="level-title">Balance</h1>
                <span id="solved-mark" aria-label="Solved">✓</span>
            </div>
            <p id="level-concept"></p>
        </section>

    </main>

</div>

<script type="text/javascript">

(()=>{

    katex.render("x", 
        document.getElementById('logo'), 
        {throwOnError: false })

    const taglines = [
        'An introduction to algebra',
        'Every change to both sides',
        'There are no wrong moves',
        'The search for x',
        'The quest for x',
        'Easy. Ordered. Correct.',
        'Conveying thought with precision',
        'An app for a language of precision',
        'An app for a language of truth',
        'A game played according to certain simple rules',
        'meaningless marks on paper',
        'meaningless symbols on a screen', 
    ];
    document.getElementById('tagline').replaceChildren(taglines[Math.floor(Math.random()*taglines.length)]);

    const freeze = Object.freeze;

    const zero = new Expression('constant', 0);
    const one = new Expression('constant', 1);
    const minus_one = new Expression('constant', -1);

    const left_inverse_divide = (type, inverse) => divisor => expression =>
        new Expression(type, [inverse(divisor), expression]);

    const right_inverse_divide = (type, inverse) => divisor => expression =>
        new Expression(type, [expression, inverse(divisor)]);

    const additive_inverse = divisor => {
        return new Expression(
            'mul',
            divisor.type === 'mul'?
                [minus_one, ...divisor.contents]
              : [minus_one, divisor]
        )
    };

    const multiplicative_inverse = divisor => {
        let inverse = new Expression('pow', [divisor, minus_one]).caveat(new Relation('neq', divisor, zero));
        if (divisor.type === 'pow' && divisor.contents.length === 2 &&
            divisor.contents[1].type === 'constant'
        ) {
            if (divisor.contents[1].contents === -1) inverse = divisor.contents[0];
        }
        return inverse;
    };

    const grouplikes = Grouplikes({
        'add': Grouplike('add',
            {
                is_commutative: true,
                is_associative: true,
                left_identity: zero,
                right_identity: zero,
                left_divide: left_inverse_divide('add', additive_inverse),
                right_divide: right_inverse_divide('add', additive_inverse),
            },
            items => items.reduce((accumulator, item) => accumulator + item, 0)
        ),
        'mul': Grouplike('mul',
            {
                is_commutative: true,
                is_associative: true,
                left_identity: one,
                right_identity: one,
                left_annihilator: zero,
                right_annihilator: zero,
                left_divide: left_inverse_divide('mul', multiplicative_inverse),
                right_divide: right_inverse_divide('mul', multiplicative_inverse),
            },
            items => items.reduce((accumulator, item) => accumulator * item, 1)
        ),
        'pow': Grouplike('pow',
            {
                right_identity: one,
            },
            items => Math.pow(...items)
        ),
        'log': Grouplike('log',
            {},
            items => Math.log(items[1]) / Math.log(items[0])
        ),
        'root': Grouplike('root',
            {},
            items => Math.pow(items[1], 1 / items[0])
        ),
        'harmonic': Grouplike('harmonic',
            {
                is_commutative: true,
                is_associative: true,
            },
            items => 1 / items.reduce((sum, item) => sum + 1/item, 0)
        ),
    });

    const expression_shape = ExpressionShape(grouplikes);
    const orderlikes = Orderlikes({
        eq: Orderlike('eq', {
            is_reflexive: true,
            is_symmetric: true,
            is_transitive: true,
            is_antisymmetric: true,
            converse: 'eq',
        }, (left, right) => left === right),
        neq: Orderlike('neq', {
            is_symmetric: true,
            converse: 'neq',
        }, (left, right) => left !== right),
        lt: Orderlike('lt', {
            is_transitive: true,
            is_asymmetric: true,
            converse: 'gt',
        }, (left, right) => left < right),
        lte: Orderlike('lte', {
            is_reflexive: true,
            is_transitive: true,
            is_antisymmetric: true,
            converse: 'gte',
        }, (left, right) => left <= right),
        gt: Orderlike('gt', {
            is_transitive: true,
            is_asymmetric: true,
            converse: 'lt',
        }, (left, right) => left > right),
        gte: Orderlike('gte', {
            is_reflexive: true,
            is_transitive: true,
            is_antisymmetric: true,
            converse: 'lte',
        }, (left, right) => left >= right),
    }, grouplikes);
    const expression_caveats = ExpressionCaveats(expression_shape, orderlikes);
    const ringlikes = Ringlikes({
        add: ScaleExpressions(grouplikes, Scales(grouplikes, expression_shape)),
        mul: PowerExpressions(grouplikes, Powers(grouplikes, expression_shape)),
    });
    const power_triangles = PowerTriangles(grouplikes, expression_shape);

    const equations = Relations({
        expression_shape: expression_shape,
        grouplikes: grouplikes,
        ringlikes: ringlikes,
        orderlikes: orderlikes,
        expression_caveats: expression_caveats,
        invertibles: freeze([
            PowerTriangleInverse(power_triangles, expression_shape),
        ]),
        equivalences: freeze([
            PowerTriangleSameness(power_triangles, grouplikes),
            PowerTriangleComposition(power_triangles, grouplikes),
        ]),
    });

    const expression_paths = ExpressionPaths(grouplikes);
    const equation_drag_ops = RelationDragOperations({
        expression_paths: expression_paths,
        expression_shape: expression_shape,
        equations: equations,
        equation_path_operations: RelationPathOperations({
            expression_paths: expression_paths,
            equations: equations,
        }),
    });

    const history = AppHistoryTraversal(Infinity);

    const equation_drags = RelationDrags(equation_drag_ops);
    const app_updater = AppUpdater({
        app_history_traversal: history,
        drag_ops: AppDragOperations(equation_drags, history),
        equation_drags: equation_drags,
        expression_shape: expression_shape
    });

    const html = Html(document);

    const expression_view = ExpressionView({
        html: html,
        render: katex.render,
        expression_paths: expression_paths,
        grouplikes: grouplikes,
        ringlikes: ringlikes,
        precedence_for_tag: tag => {
            switch (tag) {
                case 'add': return 1;
                case 'mul': return 2;
                case 'pow': return 3;
                case 'log': return 3;
                case 'root': return 3;
                case 'harmonic': return 3;
                default: return 4;
            }
        }
    });

    const equation_view = RelationView({
        html: html,
        render: katex.render,
        equation_drag_operations: equation_drag_ops,
        expression_view: expression_view,
        expression_caveats: expression_caveats,
    });

    const app_view = AppView({
        html: html,
        render: katex.render,
        equation_view: equation_view,
        expression_shape: expression_shape,
    }, app_updater);

    const released = equation_drags.release();
    const levels = Levels(grouplikes);
    app_view.wire(
        new AppState(
            levels, 0, // levels
            levels[0].equation, // equation
            released, released.initialize(), // drag
            [], // drag choices
            [], [], // history
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?
                'night' : 'day',
            { auto_simplify:false },
            false,
            courses
        ), document
    );

})();

</script>

</body>
</html>
