<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="description" content="A drag-to-transform algebra game.">
    <title>xcraft</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./styles/app.css">
    <link rel="stylesheet" href="./styles/toolbars.css">

    <script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"></script>
    <script src="./scripts/dom/Html.js"></script>
    <script src="./scripts/models/expression/Expression.js"></script>
    <script src="./scripts/models/expression/ExpressionShape.js"></script>
    <script src="./scripts/models/expression/ExpressionPaths.js"></script>
    <script src="./scripts/models/expression/ExpressionOperations.js"></script>
    <script src="./scripts/models/grouplike/Grouplike.js"></script>
    <script src="./scripts/models/grouplike/Grouplikes.js"></script>
    <script src="./scripts/models/ringlike/Scale.js"></script>
    <script src="./scripts/models/ringlike/Scales.js"></script>
    <script src="./scripts/models/ringlike/ScaleExpressions.js"></script>
    <script src="./scripts/models/ringlike/Power.js"></script>
    <script src="./scripts/models/ringlike/Powers.js"></script>
    <script src="./scripts/models/ringlike/PowerExpressions.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangle.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangles.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangleSameness.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangleComposition.js"></script>
    <script src="./scripts/models/powertriangle/PowerTriangleInverse.js"></script>
    <script src="./scripts/models/ringlike/Ringlike.js"></script>
    <script src="./scripts/models/equation/Equation.js"></script>
    <script src="./scripts/models/equation/Equations.js"></script>
    <script src="./scripts/models/equation/EquationDragOperations.js"></script>
    <script src="./scripts/models/equation/EquationShape.js"></script>
    <script src="./scripts/models/app/AppState.js"></script>
    <script src="./scripts/models/app/AppHistoryTraversal.js"></script>
    <script src="./scripts/models/app/AppDragOperations.js"></script>
    <script src="./scripts/updaters/drags/DragState.js"></script>
    <script src="./scripts/updaters/drags/EquationDrags.js"></script>
    <script src="./scripts/updaters/AppUpdater.js"></script>
    <script src="./scripts/views/ExpressionView.js"></script>
    <script src="./scripts/views/EquationView.js"></script>
    <script src="./scripts/views/AppView.js"></script>
    <script src="./scripts/levels/Levels.js"></script>
</head>

<body>

<div id="app">

    <div class="top left short-axis-group control">

        <div class="banner"> 
            <div class="title"><div id="logo"></div>craft</div>
            <div id="subtitle" class="subtitle">An introduction to algebra</div>
        </div>

        <div class="short-axis-group group-joined">

            <button id="undo" type="button" class="btn">
                <div>Undo</div>
                <img src="icons/undo.svg"/>
                <div class="instructions">ctrl+Z</div>
            </button>

            <button id="redo" type="button" class="btn">
                <div>Redo</div>
                <img src="icons/redo.svg"/>
                <div class="instructions">ctrl+Y</div>
            </button>

            <button id="restart" type="button" class="btn">
                <div>Restart</div>
                <img src="icons/rotate-ccw.svg"/>
            </button>

            <button id="drag-add" type="button" class="btn operation-toggle" aria-pressed="true">
                <div>Add</div>
                <img src="icons/add.svg"/>
                <div id="drag-add-indicator">On</div>
            </button>

            <button id="drag-multiply" type="button" class="btn operation-toggle" aria-pressed="true">
                <div>Multiply</div>
                <img src="icons/multiply.svg"/>
                <div id="drag-multiply-indicator">On</div>
            </button>

            <button id="auto-simplify" type="button" class="btn operation-toggle" aria-pressed="true">
                <div>Simplify</div>
                <img src="icons/equal.svg"/>
                <div id="auto-simplify-indicator">On</div>
            </button>

            <button id="theme" type="button" class="btn">
                <div>Theme</div>
                <div id='light'><img src="icons/light.svg"/><div>Light</div></div>
                <div id='dark'><img src="icons/dark.svg"/><div>Dark</div></div>
            </button>

        </div>

    </div>

    <nav class="top right control level-navigation" aria-label="Level navigation">

        <div id="level-menu" class="level-menu" aria-label="Levels"></div>

        <div class="level-navigation-footer">
            <div id="level-counter" class="level-counter">1 / 27</div>

            <div class="short-axis-group group-joined">

                <button id="previous-level" type="button" class="btn">
                    <div>Previous</div>
                    <img src="icons/menu-left.svg"/>
                </button>

                <button id="next-level" type="button" class="btn">
                    <div>Next</div>
                    <img src="icons/menu-right.svg"/>
                </button>

            </div>
        </div>

    </nav>

    <main>

        <section class="lesson-header">
            <div class="lesson-title-row">
                <h1 id="level-title">Balance</h1>
                <span id="solved-mark" aria-label="Solved">✓</span>
            </div>
            <p id="level-concept"></p>
            <p id="level-context" hidden></p>
        </section>

        <section id="equation" class="equation-stage" aria-label="Interactive equation"></section>

    </main>

</div>

<script type="text/javascript">

(()=>{

    katex.render("x", 
        document.getElementById('logo'), 
        {throwOnError: false })

    const subtitles = [
        'An introduction to algebra',
        'Every change to both sides',
        'There are no wrong moves',
        'The search for x',
    ];
    document.getElementById('subtitle').replaceChildren(subtitles[Math.floor(Math.random()*subtitles.length)]);

    const expression_shape = ExpressionShape();
    const grouplikes = Grouplikes({
        'add': Grouplike('add', new Expression('constant', 0), 
            {
                is_commutative: true, 
                is_associative: true, 
                is_invertible: true,
                is_left_cancellative: true, 
                is_right_cancellative: true,
            },
            evaluate => expression => expression.contents.reduce((accumulator, item) => accumulator + evaluate(item), 0)
        ),
        'mul': Grouplike('mul', new Expression('constant', 1), 
            {
                is_commutative: true, 
                is_associative: true, 
                is_invertible: true,
                is_left_cancellative: true, 
                is_right_cancellative: true,
            },
            evaluate => expression => expression.contents.reduce((accumulator, item) => accumulator * evaluate(item), 1)
        ),
        'pow': Grouplike('pow', new Expression('constant', 1), 
            {
                is_right_cancellative: true,
            },
            evaluate => expression => Math.pow(evaluate(expression.contents[0]), evaluate(expression.contents[1]))
        ),
        'log': Grouplike('log', undefined,
            {},
            evaluate => expression => Math.log(evaluate(expression.contents[1])) / Math.log(evaluate(expression.contents[0]))
        ),
    });
    const scales = Scales(grouplikes, expression_shape);
    const scale_expressions = ScaleExpressions(grouplikes, scales);
    const powers = Powers(grouplikes, expression_shape);
    const power_triangles = PowerTriangles(grouplikes, expression_shape);
    const same_base_result = PowerTriangleSameness(
        power_triangles, grouplikes,
        power_triangles.BASE, power_triangles.RESULT,
        'add', 'mul', true
    );
    const same_exponent_result = PowerTriangleSameness(
        power_triangles, grouplikes,
        power_triangles.EXPONENT, power_triangles.RESULT,
        'mul', 'mul', false
    );
    const same_base_exponent = PowerTriangleSameness(
        power_triangles, grouplikes,
        power_triangles.BASE, power_triangles.EXPONENT,
        'mul', 'add', false
    );
    const power_composition = PowerTriangleComposition(
        power_triangles, grouplikes, power_triangles.RESULT);
    const log_composition = PowerTriangleComposition(
        power_triangles, grouplikes, power_triangles.EXPONENT);
    const inverse_exponent_result = PowerTriangleInverse(
        power_triangles, power_triangles.EXPONENT, power_triangles.RESULT);
    const inverse_base_result = PowerTriangleInverse(
        power_triangles, power_triangles.BASE, power_triangles.RESULT);
    const inverse_base_exponent = PowerTriangleInverse(
        power_triangles, power_triangles.BASE, power_triangles.EXPONENT);
    const inverse_result_exponent = PowerTriangleInverse(
        power_triangles, power_triangles.RESULT, power_triangles.EXPONENT);
    const power_expressions = PowerExpressions(
        grouplikes, powers, same_base_result, same_exponent_result,
        same_base_exponent, power_composition, log_composition);
    const ringlikes = Ringlike({
        add: scale_expressions,
        mul: power_expressions,
    });
    const expression_paths = ExpressionPaths(grouplikes);
    const expression_operations = ExpressionOperations({
        grouplikes: grouplikes,
        ringlikes: ringlikes,
        expression_shape: expression_shape,
        laws: Object.freeze([
            inverse_exponent_result,
            inverse_base_result,
            inverse_base_exponent,
            inverse_result_exponent,
        ]),
    });
    const equation_drag_ops = EquationDragOperations({
        expression_paths: expression_paths,
        equations: Equations({
            grouplikes: grouplikes,
            expression_paths: expression_paths,
            ringlikes: ringlikes,
            expression_operations: expression_operations,
        })
    });
    const equation_shape = EquationShape(expression_shape);

    const history = AppHistoryTraversal(Infinity);

    const equation_drags = EquationDrags(equation_drag_ops);
    const app_updater = AppUpdater({
        app_history_traversal: history,
        drag_ops: AppDragOperations(equation_drags, history),
        equation_drags: equation_drags,
        equation_shape: equation_shape
    });

    const html = Html(document);

    const expression_view = ExpressionView({
        html: html,
        render: katex.render,
        grouplikes: grouplikes,
        expression_paths: expression_paths,
        ringlikes: ringlikes,
        precedence_for_tag: tag => {
            switch (tag) {
                case 'add': return 1;
                case 'mul': return 2;
                case 'pow': return 3;
                case 'log': return 3;
                default: return 4;
            }
        }
    });

    const equation_view = EquationView({
        html: html,
        render: katex.render,
        equation_drag_operations: equation_drag_ops,
        expression_paths: expression_paths,
        ringlikes: ringlikes,
        expression_view: expression_view,
    });

    const app_view = AppView({
        html: html,
        render: katex.render,
        equation_view: equation_view,
        equation_shape: equation_shape,
    }, app_updater);

    const released = equation_drags.release();
    const levels = Levels(grouplikes);
    app_view.wire(
        new AppState(
            levels, 0, // levels
            levels[0].equation, // equation
            released, released.initialize(), // drag
            [], [], // history
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches?
                'night' : 'day',
            { enabled: new Set(['add', 'mul', 'pow', 'log']), auto_simplify:true }
        ), document
    );

})();

</script>

</body>
</html>
